- name: refuted_by
  inverse: refutes
  label: is refuted by
  status: canonical
- name: instance_of
  inverse: has_instance
  label: is an instance of
  status: canonical
- name: related_to
  symmetric: true
  label: related to
  status: canonical
- name: invokes
  inverse: invoked_by
  label: invokes
  status: canonical
  description: A invokes B — B is a deeper question/principle A engages
- name: invoked_by
  inverse: invokes
  label: is invoked by
  status: canonical
- name: case_of
  inverse: has_case
  label: is a case of
  status: canonical
  description: A case_of B — A is a specific instance of the more general B
- name: has_case
  inverse: case_of
  label: has as a specific case
  status: canonical
- name: refuting_case_of
  inverse: has_refuting_case
  label: is a refuting case of
  status: canonical
  description: 'A refuting_case_of B — A is a case under the umbrella B that argues
    *against* the partisan claim B hosts (typically a Christian Argument refuting
    an Islamic-apologetic reading). Renders on B''s page in the Counter-arguments
    section rather than Specific cases, so pro/contra readings split visually.

    '
- name: has_refuting_case
  inverse: refuting_case_of
  label: has as a refuting case
  status: canonical
- name: presupposes
  inverse: presupposed_by
  label: presupposes
  status: canonical
  description: A presupposes B — B is taken for granted by A
- name: presupposed_by
  inverse: presupposes
  label: is presupposed by
  status: canonical
- name: specializes
  inverse: generalizes
  label: specializes
  status: canonical
  description: A specializes B — A is a narrower version of B
- name: generalizes
  inverse: specializes
  label: generalizes
  status: canonical
- name: concerns
  inverse: concern_of
  label: concerns
  status: canonical
  description: Relational Node → entity it is "about" or "between". Materialized from
    the frontmatter `concerns:` field.
- name: concern_of
  inverse: concerns
  label: is the concern of
  status: canonical
- name: supports
  inverse: supported_by
  label: supports
  status: canonical
  description: A supports B — A provides evidence/sub-argument for B's claim. A is
    the sub-claim, B is the larger argumentative position.
- name: supported_by
  inverse: supports
  label: is supported by
  status: canonical
- name: responds_to
  inverse: has_response
  label: responds to
  status: canonical
  description: A responds_to B — A is a measured response to B, weaker than `refutes`.
    Use when "here's an answer" rather than "this disproves it."
- name: has_response
  inverse: responds_to
  label: is responded to by
  status: canonical
- name: mentions
  inverse: mentioned_in
  label: mentions
  status: canonical
  description: Implicit edge from [[wiki-links]] in body text
- name: features
