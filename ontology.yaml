node_types:
- name: Person
  status: canonical
  description: A human (biblical, historical, or legendary)
- name: Deity
  status: canonical
  description: A divine being (YHWH, gods of surrounding mythologies)
- name: Place
  status: canonical
  description: A geographic location
- name: Event
  status: canonical
  description: A discrete narrative happening
- name: Text
  status: canonical
  description: A book, scroll, or written work
- name: Passage
  status: canonical
  description: A specific pericope within a Text, commentary attached
- name: Concept
  status: canonical
  description: An abstract theological or philosophical idea
- name: Argument
  status: canonical
  description: A reasoned position taken by some interpreter or tradition
- name: Theory
  status: canonical
  description: A structured hypothesis (documentary hypothesis, Q source, etc.)
- name: Mythological
  status: canonical
  description: A non-biblical mythological figure, story, or motif used for comparison
- name: Tradition
  status: canonical
  description: A religious / interpretive lineage (Rabbinic, Patristic, Reformed,
    etc.)
- name: Manuscript
  status: canonical
  description: A physical textual witness (Dead Sea Scrolls, Masoretic codices, NT
    papyri, ancient versions)
- name: Council
  status: canonical
  description: An ecclesiastical council or synod (Nicaea, Chalcedon, Trent, Vatican
    II, etc.)
- name: Angel
  status: seen
