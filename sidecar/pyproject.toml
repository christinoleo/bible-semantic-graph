[project]
name = "sidecar"
version = "0.1.0"
description = "Bible Semantic Graph — Python sidecar: ingestion pipeline + ML serving"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "granian>=2.0",
    "pydantic>=2.9",
    "python-frontmatter>=1.1",
    "mistune>=3.0",
    "watchfiles>=0.24",
    # torch pinned to 2.5.x: last release whose official wheels still ship
    # sm_61 (Pascal) kernels — required for GTX 10-series GPUs.
    "torch==2.5.1",
    "sentence-transformers>=3.0,<4.0",
    "sqlite-vec>=0.1.6",
    "apsw>=3.46",
    "pyyaml>=6.0",
    "unidecode>=1.3",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.13",
]

[project.scripts]
ingest = "pipeline.ingest:main"
watch = "pipeline.watch:main"
validate = "pipeline.validate:main"
serve = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
